version: '3.9'
services:
  hanko-migrate:
    build: ../../backend
    volumes:
      - type: bind
        source: ./config.oauth.yaml
        target: /etc/config/config.yaml
    command: --config /etc/config/config.yaml migrate up
    restart: on-failure
    depends_on:
      postgresd:
        condition: service_healthy
    networks:
      - intranet
  hanko:
    depends_on:
      hanko-migrate:
        condition: service_completed_successfully
    build: ../../backend
    ports:
      - '4602:8000' # public
    restart: unless-stopped
    command: serve --config /etc/config/config.yaml all
    volumes:
      - type: bind
        source: ./config.oauth.yaml
        target: /etc/config/config.yaml
    networks:
      - intranet
    env_file:
      - ./.env
    environment:
      - PASSWORD_ENABLED
  postgresd:
    image: postgres:12-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hanko
      - POSTGRES_PASSWORD=hanko
      - POSTGRES_DB=hanko
    healthcheck:
      test: pg_isready -U hanko -d hanko
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - intranet
  elements:
    build: ../../frontend
    ports:
      - "4603:80"
    networks:
      - intranet
  quickstart:
    build: ../../quickstart
    ports:
      - "4601:8080"
    environment:
      - HANKO_URL=http://localhost:4602
      - HANKO_URL_INTERNAL=http://hanko:8000
      - HANKO_ELEMENT_URL=http://localhost:4603/elements.js
      - HANKO_FRONTEND_SDK_URL=http://localhost:4603/sdk.modern.js
    networks:
      - intranet
  mailslurper:
    image: marcopas/docker-mailslurper:latest
    ports:
      - '8080:8080' # web UI
      - '8085:8085'
    networks:
      - intranet
networks:
  intranet:
